name: slither

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/slither.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/slither.yml'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Slither calls `forge build` under the hood; we need foundry on PATH.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Slither static analysis
        id: slither
        uses: crytic/slither-action@v0.4.2
        with:
          target: 'contracts/'
          slither-args: '--filter-paths "lib/|test/|script/" --exclude naming-convention,solc-version,assembly,low-level-calls'
          fail-on: medium
          sarif: results.sarif
        continue-on-error: false

      - name: Upload SARIF
        if: always() && steps.slither.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.slither.outputs.sarif }}
