name: sdk

on:
  push:
    branches: [main]
    paths:
      - 'packages/sdk/**'
      - 'contracts/src/**'
      - 'contracts/script/**'
      - 'contracts/foundry.toml'
      - 'contracts/foundry.lock'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/sdk.yml'
  pull_request:
    paths:
      - 'packages/sdk/**'
      - 'contracts/src/**'
      - 'contracts/script/**'
      - 'contracts/foundry.toml'
      - 'contracts/foundry.lock'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/sdk.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Integration tests spawn anvil + deploy contracts; needs foundry on PATH.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      # SDK integration tests run `forge script` to deploy the pool — that needs
      # the same libs contracts.yml does. Versions pinned to match foundry.lock.
      - name: forge install
        working-directory: contracts
        run: |
          forge install --no-commit \
            foundry-rs/forge-std@v1.16.1 \
            OpenZeppelin/openzeppelin-contracts@v5.6.1 \
            smartcontractkit/chainlink-brownie-contracts@1.3.0

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: SDK typecheck
        run: pnpm --filter @arcoralabs/dex-sdk typecheck

      - name: SDK build
        run: pnpm --filter @arcoralabs/dex-sdk build

      - name: SDK test (unit + integration + react hooks)
        run: pnpm --filter @arcoralabs/dex-sdk test
