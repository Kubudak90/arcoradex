name: contracts

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: forge install
        run: forge install --no-commit
      - name: forge fmt --check
        run: forge fmt --check
      - name: forge build --sizes
        run: forge build --sizes
      - name: forge test (CI profile — 1024x128 invariants, 10k fuzz)
        env:
          FOUNDRY_PROFILE: ci
        run: forge test -vvv
      # Snapshot drift is a soft signal; we record but don't block on it.
      - name: forge snapshot (record drift)
        run: forge snapshot --check
        continue-on-error: true
