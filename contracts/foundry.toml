[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./"}]
gas_reports = ["ArcoraDexPool"]
ffi = true

[profile.ci]
fuzz = { runs = 10000 }
invariant = { runs = 1024, depth = 128 }

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC}"
base_mainnet = "${BASE_MAINNET_RPC}"

[etherscan]
arc_testnet = { key = "${ARC_EXPLORER_KEY}", url = "${ARC_EXPLORER_URL}" }
